version: '3.8'

# Always-on desk (same contract as Railway). Paper DISARMED. IBKR off.
# Delayed Yahoo — zero paid keys required. Mount ./data or a named volume
# so shadow ledger / paper state survive restarts.

services:
  flowscout:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      FLOWSCOUT_CLOUD: "1"
      FLOWSCOUT_HOST: "0.0.0.0"
      FLOWSCOUT_DATA_DIR: /data
      PAPER_AUTO_ARMED: "false"
      IBKR_ENABLED: "0"
      UNATTENDED: "0"
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      FLOWSCOUT_DESK_TOKEN: ${FLOWSCOUT_DESK_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    restart: unless-stopped
    volumes:
      - flowscout-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s

volumes:
  flowscout-data:
